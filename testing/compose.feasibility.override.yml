# RRN-00 / RRN-01: Icecast + LibreTime 4.5.0 NON-PRODUCTION feasibility profile.
# This is a guarded CONFIGURATION ONLY, not an installation or deployment.
#
# Use together with upstream libretime/libretime tag 4.5.0 docker-compose.yml,
# a privately generated config.yml, and a private environment file.
# Docker Compose >= 2.24.4 is required for !override.
# Verify host ports, resource headroom, Compose version and a secret-redacted
# rendered model before any explicitly authorized installation.
#
# The official LibreTime 4.5.0 Compose bundles Icecast 2.4.4; this profile
# does NOT require SHOUTcast, proprietary binaries or another streaming server.
#
# IMPORTANT: Compose normally MERGES port lists. !override REPLACES upstream
# mappings and prevents accidentally publishing ports 8000, 8001, 8002, 8080.
# All three exposed ports in this feasibility profile bind to 127.0.0.1 only.
#
# LibreTime's single SHOW source listens on internal liquidsoap:8002, whereas
# the MAIN source listens on 8001. Do not map a Show DJ to port 8001.
# Icecast's INTERNAL connection uses service DNS "icecast", port 8000.
# A public stream, remote DJ ingress, TLS and DNS are separate approval steps.

name: rcat_radio_feasibility

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private POSTGRES_PASSWORD before rendering}

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set private RABBITMQ_DEFAULT_PASS before rendering}

  playout:
    image: ghcr.io/libretime/libretime-playout:4.5.0

  liquidsoap:
    image: ghcr.io/libretime/libretime-playout:4.5.0
    ports: !override
      - "127.0.0.1:8605:8002"

  analyzer:
    image: ghcr.io/libretime/libretime-analyzer:4.5.0

  worker:
    image: ghcr.io/libretime/libretime-worker:4.5.0

  api:
    image: ghcr.io/libretime/libretime-api:4.5.0

  legacy:
    image: ghcr.io/libretime/libretime-legacy:4.5.0

  nginx:
    image: ghcr.io/libretime/libretime-nginx:4.5.0
    ports: !override
      - "127.0.0.1:8700:8080"

  icecast:
    image: ghcr.io/libretime/icecast:2.4.4
    ports: !override
      - "127.0.0.1:8600:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Set private ICECAST_SOURCE_PASSWORD before rendering}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Set private ICECAST_ADMIN_PASSWORD before rendering}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?Set private ICECAST_RELAY_PASSWORD before rendering}
