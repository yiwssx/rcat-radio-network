server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' http:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Read-only public Now Playing endpoint; no authenticated AzuraCast API exposed.
    location ~ ^/api/nowplaying(?:/|$) {
        limit_except GET { deny all; }
        proxy_pass http://web:8700;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Server;
    }

    location /api/ {
        return 403;
    }
}
