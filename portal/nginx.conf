server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Read-only public Now Playing endpoint; no authenticated AzuraCast API exposed.
    location = /api/nowplaying/rcat_radio {
        limit_except GET { deny all; }
        proxy_pass http://web:8700;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header Server;
    }

    # Only the public stream of the RCAT station is forwarded. Nginx
    # never proxies administrative /login or /admin routes.
    location ^~ /listen/rcat_radio/ {
        limit_except GET { deny all; }
        proxy_pass http://web:8700;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_hide_header Server;
    }

    location = /stream-url.mjs {
        default_type text/javascript;
        try_files $uri =404;
    }

    location /api/ {
        return 403;
    }
}
