name: audit and pilot static tests

on:
  pull_request:
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py

  compose-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose and reject unsafe published ports
        shell: bash
        run: |
          set -euo pipefail
          cp deployment/.env.example deployment/.env
          sed -i 's/^RRN_BIND_IP=.*/RRN_BIND_IP=127.0.0.1/' deployment/.env
          cp deployment/azuracast.env.example deployment/azuracast.env
          docker compose -f deployment/compose.pilot.yaml config --format json |
            python3 scripts/compose_audit.py
