name: audit and pilot static tests

on:
  pull_request:
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify player stream URL routing
        run: node --test tests/stream-url.test.mjs
      - name: Syntax-check Docker-only operator command
        run: |
          bash -n scripts/radioctl.sh
          bash scripts/radioctl.sh --help

  compose-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose and reject unsafe published ports
        shell: bash
        run: |
          set -euo pipefail
          cp deployment/.env.example deployment/.env
          sed -i 's/^RRN_BIND_IP=.*/RRN_BIND_IP=127.0.0.1/' deployment/.env
          cp deployment/azuracast.env.example deployment/azuracast.env
          docker compose -p rcat_radio_pilot -f deployment/compose.pilot.yaml config --format json |
            docker compose -p rcat_radio_pilot -f deployment/compose.pilot.yaml --profile audit run --rm -T --no-deps audit
      - name: Validate portal Nginx syntax without starting radio
        shell: bash
        run: |
          docker run --rm --network none --add-host web:127.0.0.1 \
            -v "$PWD/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t

  proxy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual Nginx routing against a harmless mock station
        shell: bash
        run: |
          set -euo pipefail
          docker network create rrn-ci
          trap 'docker rm -f rrn-nginx-ci web >/dev/null 2>&1 || true; docker network rm rrn-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name web --network rrn-ci \
            -v "$PWD/tests/mock_upstream.py:/mock.py:ro" \
            python:3.12-alpine python /mock.py
          docker run -d --name rrn-nginx-ci --network rrn-ci \
            -p 127.0.0.1:18750:80 \
            -v "$PWD/portal:/usr/share/nginx/html:ro" \
            -v "$PWD/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine
          for i in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:18750/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18750/api/nowplaying/rcat_radio \
            | python -c 'import json,sys; assert json.load(sys.stdin)["station"]["shortcode"] == "rcat_radio"'
          curl -fsS http://127.0.0.1:18750/listen/rcat_radio/radio.mp3 -o /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18750/api/nowplaying/other_station)" = 403
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18750/admin)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18750/login)" = 404

  monitor-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated ffmpeg monitor and check CLI entrypoint
        run: |
          set -euo pipefail
          docker build -f deployment/Dockerfile.monitor -t rrn-monitor:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges rrn-monitor:ci --help
