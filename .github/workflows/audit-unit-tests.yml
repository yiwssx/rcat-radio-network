name: audit unit tests
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/audit-unit-tests.yml"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/workflows/audit-unit-tests.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
