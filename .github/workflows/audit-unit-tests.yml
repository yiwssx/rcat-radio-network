name: audit and pilot static tests

on:
  pull_request:
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "deployment/**", "portal/**", "docs/**", ".github/workflows/audit-unit-tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify player stream URL routing
        run: node --test tests/stream-url.test.mjs
      - name: Syntax-check Docker-only operator command
        run: |
          bash -n scripts/radioctl.sh
          bash scripts/radioctl.sh --help

  compose-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose and reject unsafe published ports
        shell: bash
        run: |
          set -euo pipefail
          cp deployment/.env.example deployment/.env
          sed -i 's/^RRN_BIND_IP=.*/RRN_BIND_IP=127.0.0.1/' deployment/.env
          cp deployment/azuracast.env.example deployment/azuracast.env
          docker compose -p rcat_radio_pilot -f deployment/compose.pilot.yaml config --format json |
            docker compose -p rcat_radio_pilot -f deployment/compose.pilot.yaml --profile audit run --rm -T --no-deps audit
      - name: Validate portal Nginx syntax without starting radio
        shell: bash
        run: |
          docker run --rm --network none --add-host web:127.0.0.1 \
            -v "$PWD/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
