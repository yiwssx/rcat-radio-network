name: RRN-22 Listener release candidate

# This workflow is explicitly authorized for Issue #22. It is intentionally
# scoped to the existing frontend branch and never deploys to RCAT hosts.
on:
  push:
    branches:
      - feat/issue-22-green-listener-svelte
    paths:
      - 'listener-web/**'
      - '.github/workflows/rrn22-listener-candidate.yml'

permissions:
  contents: read

concurrency:
  group: rrn22-listener-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Check, test, build and package static listener
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source and create candidate
        working-directory: listener-web
        run: bash scripts/prepare-static-release.sh

      - name: Browser-independent local HTTP smoke (no public requests)
        working-directory: listener-web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run preview > /tmp/rrn22-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/rrn22-index.html 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/rrn22-preview.log
            echo 'FAIL: preview did not respond over localhost'
            exit 1
          fi
          grep -q 'assets/index-' /tmp/rrn22-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/images/RCAT.png -o /tmp/rrn22-logo.png
          cmp public/images/RCAT.png /tmp/rrn22-logo.png
          echo 'PASS: local preview loads index, bundled assets and the exact owner-supplied logo'

      - name: Upload verified deployable static files + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: rrn22-listener-candidate-${{ github.sha }}
          path: |
            listener-web/artifacts/rrn22-listener-dist.tar.gz
            listener-web/artifacts/rrn22-listener-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record immutable candidate reference
        shell: bash
        run: |
          {
            echo "### RCAT Listener build candidate"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Svelte typecheck: required"
            echo "- Metadata parser tests: required"
            echo "- Production Vite build: required"
            echo "- Local HTTP smoke: required"
            echo "- Owner-supplied RCAT.png checksum: required"
            echo "- Download artifact from this Actions run (retained 14 days)"
            echo "- **Not deployed:** Apache/Icecast/LibreTime remain untouched"
          } >> "$GITHUB_STEP_SUMMARY"
