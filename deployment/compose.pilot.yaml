# Self-contained LAN pilot. Do not run AzuraCast's interactive docker.sh install
# on the shared host; its generated Compose has broad default port mappings
# and an updater that mounts the Docker socket.
name: rcat_radio_pilot

services:
  web:
    image: ghcr.io/azuracast/azuracast:${AZURACAST_VERSION:-stable}
    env_file:
      - ./.env
      - ./azuracast.env
    ports:
      - "127.0.0.1:8700:8700" # Administration ONLY through SSH tunnel
      - "${RRN_BIND_IP:?Set approved LAN address}:8600:8600" # Icecast test station
      - "${RRN_BIND_IP:?Set approved LAN address}:8605:8605" # DJ input (if used)
      - "${RRN_BIND_IP:?Set approved LAN address}:8606:8606" # alternate DJ input
    volumes:
      - station_data:/var/azuracast/stations
      - backups:/var/azuracast/backups
      - db_data:/var/lib/mysql
      - www_uploads:/var/azuracast/storage/uploads
      - shoutcast2_install:/var/azuracast/storage/shoutcast2
      - stereo_tool_install:/var/azuracast/storage/stereo_tool
      - rsas_install:/var/azuracast/storage/rsas
      - geolite_install:/var/azuracast/storage/geoip
      - sftpgo_data:/var/azuracast/storage/sftpgo
      - acme:/var/azuracast/storage/acme
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      options:
        max-size: "1m"
        max-file: "5"

  portal:
    image: nginx:stable-alpine
    ports:
      - "${RRN_BIND_IP:?Set approved LAN address}:8750:80"
    volumes:
      - ../portal/index.html:/usr/share/nginx/html/index.html:ro
      - ../portal/player.js:/usr/share/nginx/html/player.js:ro
      - ../portal/stream-url.mjs:/usr/share/nginx/html/stream-url.mjs:ro
      - ../portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "3"

  # Disposable validator. It receives rendered Compose on stdin, but NEVER
  # has Docker socket access. Python exists only inside this image.
  audit:
    image: python:3.12-alpine
    profiles: ["audit"]
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../scripts/compose_audit.py:/audit/compose_audit.py:ro
    entrypoint: ["python", "/audit/compose_audit.py"]
    restart: "no"

  # Operational tools are opt-in; 'compose up -d web portal' never starts them.
  monitor:
    profiles: ["monitor"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.monitor
    depends_on:
      - portal
    environment:
      RRN_ALERT_WEBHOOK_URL: ${RRN_ALERT_WEBHOOK_URL:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    logging:
      options:
        max-size: "2m"
        max-file: "5"

  acceptance:
    image: python:3.12-alpine
    profiles: ["acceptance"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: "default"
    volumes:
      - ../scripts/acceptance.py:/opt/rrn/acceptance.py:ro
    entrypoint: ["python", "/opt/rrn/acceptance.py"]
    restart: "no"

volumes:
  station_data: {}
  backups: {}
  db_data: {}
  www_uploads: {}
  shoutcast2_install: {}
  stereo_tool_install: {}
  rsas_install: {}
  geolite_install: {}
  sftpgo_data: {}
  acme: {}
